name: CI

on:
  push: {branches: [main]}
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --python 3.12
        working-directory: service

      - name: Lint
        run: uv run ruff check src tests
        working-directory: service

      - name: Format check
        run: uv run ruff format --check src tests
        working-directory: service

      - name: Type check
        run: uv run mypy
        working-directory: service

      # Whitelisted, so a finding here is a real one rather than noise.
      - name: Dead code
        run: uv run vulture src/ scripts/ migrations/ vulture_whitelist.py --min-confidence 60
        working-directory: service

      # Governance invariants run on every commit, not only in the Phase 4
      # security suite. By Phase 4 the data model is already fixed.
      - name: Governance and isolation invariants
        run: uv run pytest -q tests/test_gateway_invariant.py tests/test_tenant_isolation.py tests/test_retention.py
        working-directory: service

      # Catches a model change that forgot its revision, and proves the chain
      # is reversible (NX-030).
      - name: Migration drift and rollback
        run: uv run pytest -q tests/test_migrations.py
        working-directory: service

      - name: Full test suite
        run: uv run pytest -q
        working-directory: service

  # SQLite cannot exercise the append-only grant, so the migration chain is
  # also applied against the engine the pilot will actually run on.
  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      # Migrations run as the owner; the service role is separate and is not a
      # superuser, because a superuser or owner bypasses the ACL entirely.
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
      NEXUS_DB_APP_ROLE: nexus_app
      APP_DATABASE_URL: postgresql+asyncpg://nexus_app:nexus_app@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv sync --python 3.12
        working-directory: service

      - name: Create the least-privilege application role
        run: psql "postgresql://nexus:nexus@localhost:5432/nexus" -f deploy/postgres-init/01-app-role.sql
        working-directory: service

      - name: Upgrade to head
        run: uv run alembic upgrade head
        working-directory: service

      - name: Round trip to base and back
        run: uv run alembic downgrade base && uv run alembic upgrade head
        working-directory: service

      # The control this asserts is only meaningful for a non-superuser,
      # non-owner role - so the check verifies that too, rather than trusting it.
      - name: Confirm audit_record is append-only for the application role
        run: uv run python scripts/check_audit_append_only.py
        working-directory: service

      - name: Reject a superuser application role
        run: |
          uv run alembic downgrade base
          if NEXUS_DB_APP_ROLE=nexus uv run alembic upgrade head 2>/dev/null; then
            echo "migration accepted a superuser application role" && exit 1
          fi
          echo "migration correctly refused a superuser application role"
        working-directory: service

  build:
    runs-on: ubuntu-latest
    needs: [check, migrations-postgres]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nexus-agent:${{ github.sha }} .
        working-directory: service
