services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes:
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Migrations are a deploy step. The api waits for this to finish rather than
  # creating schema itself, so replicas cannot race (NX-030).
  migrate:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # Migrations run as the owner; the service does not.
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      NEXUS_DB_APP_ROLE: nexus_app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    environment:
      NEXUS_ENV: dev
      # The service connects as nexus_app: not a superuser, owns nothing, and
      # holds no UPDATE or DELETE on audit_record (NX-022).
      NEXUS_DATABASE_URL: postgresql+asyncpg://nexus_app:nexus_app@postgres:5432/nexus
      NEXUS_REDIS_URL: redis://redis:6379/0
      # Passed through from your shell, with the safe stub as the default. These
      # were hardcoded to the stub, so an exported key was silently ignored and
      # the container always ran the echo adapter.
      NEXUS_MODEL_PROVIDER: ${NEXUS_MODEL_PROVIDER:-echo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      NEXUS_CONNECTOR: ${NEXUS_CONNECTOR:-mock}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    ports: ["8000:8000"]
